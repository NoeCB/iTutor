<ion-header>
  <ion-toolbar>
    <ion-title>Acceso Plataforma Tutorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    
    <!-- Mensajes de validación reactiva y asíncrona -->
    <div class="error-messages" *ngIf="loginForm.get('email')?.touched">
      <ion-text color="danger" *ngIf="loginForm.get('email')?.hasError('required')">
        <p>El correo es obligatorio.</p>
      </ion-text>
      <ion-text color="danger" *ngIf="loginForm.get('email')?.hasError('email')">
        <p>Formato de correo inválido.</p>
      </ion-text>
      <ion-text color="warning" *ngIf="loginForm.get('email')?.pending">
        <p>Comprobando disponibilidad del correo...</p>
      </ion-text>
      <ion-text color="danger" *ngIf="loginForm.get('email')?.hasError('emailExists')">
        <p>Este correo ya está registrado en el sistema.</p>
      </ion-text>
    </div>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Rol de acceso</ion-label>
      <ion-select formControlName="role">
        <ion-select-option value="Admin">Coordinador (Admin)</ion-select-option>
        <ion-select-option value="Standard">Profesor (Estándar)</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="!loginForm.valid" class="ion-margin-top">
      Acceder
    </ion-button>
    
  </form>
</ion-content>
