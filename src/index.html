<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>iTUTOR • Plataforma de Tutorías</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <!--
    Accesibilidad (WCAG 2.1 AA - criterio 1.4.4 "Redimensionar el texto"):
    NO se restringe el zoom del usuario. Se han eliminado `maximum-scale=1.0`
    y `user-scalable=no` para permitir ampliar el contenido hasta el 200 %.
  -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Google Fonts: Outfit (Logo Tech) & Poppins (UI Moderna) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

</html>
