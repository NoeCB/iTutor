<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>iTUTOR • Plataforma de Tutorías</title>
  <meta name="description" content="iTUTOR: plataforma para gestionar tutorías, alumnos, profesores, calendario de clases y facturación de una academia, con informes en PDF y CSV." />

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <!--
    Accesibilidad (WCAG 2.1 AA - criterio 1.4.4 "Redimensionar el texto"):
    NO se restringe el zoom del usuario. Se han eliminado `maximum-scale=1.0`
    y `user-scalable=no` para permitir ampliar el contenido hasta el 200 %.
  -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- PWA: manifest, color de la barra del sistema e iconos -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="assets/icon/icon.svg" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="iTUTOR" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!--
    Google Fonts: Outfit (logo) y Poppins (UI) cargadas SIN bloquear el
    renderizado: se piden como `preload` y se aplican al terminar de llegar.
    Mientras tanto se pinta con la fuente del sistema (display=swap).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" />
  </noscript>

  <!--
    Splash inicial (app shell). Se pinta con el HTML, antes de que descargue
    JavaScript, y Angular lo sustituye al arrancar. Reduce el FCP/LCP en móvil
    y evita la pantalla en blanco en conexiones lentas.
  -->
  <style>
    .it-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
      background:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 50%,#eff6ff 100%);color:#0f172a;
      font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .it-splash__badge{width:64px;height:64px;border-radius:18px;box-shadow:0 10px 20px -5px rgba(37,99,235,.4)}
    .it-splash__logo{margin:0;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:2.75rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
    .it-splash__logo span{color:#2563eb}
    .it-splash__tagline{margin:0;font-size:.95rem;color:#475569}
    .it-splash__bar{width:120px;height:4px;border-radius:4px;background:#dbeafe;overflow:hidden}
    .it-splash__bar::after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:#2563eb;animation:it-load 1.1s ease-in-out infinite}
    @keyframes it-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){.it-splash__bar::after{animation:none;width:100%}}
  </style>
</head>

<body>
  <app-root>
    <div class="it-splash" role="status" aria-live="polite">
      <img class="it-splash__badge" src="assets/icon/icon.svg" width="64" height="64" alt="" />
      <p class="it-splash__logo"><span>i</span>TUTOR</p>
      <p class="it-splash__tagline">Plataforma Inteligente de Gestión de Tutorías</p>
      <div class="it-splash__bar" aria-hidden="true"></div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Cargando iTUTOR…</span>
    </div>
  </app-root>
  <noscript>
    <p style="font-family:sans-serif;text-align:center;padding:24px">iTUTOR necesita JavaScript activado para funcionar.</p>
  </noscript>
</body>

</html>
